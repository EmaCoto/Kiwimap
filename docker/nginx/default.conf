server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    client_max_body_size 10M;

    # ── Vite HMR WebSocket — debe ir PRIMERO
    # Vite usa esta ruta para el socket de hot reload
    location ~* ^/(@vite|@@vite|@fs|@id|@react-refresh|__vite_ping|vite/client) {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Assets de Vite (JS/CSS compilados en dev)
    location ~* \.(js|jsx|ts|tsx|css|svg|png|jpg|gif|ico|woff|woff2)$ {
        # Intentar servir desde disco primero (storage, public)
        # Si no existe, proxy a Vite (assets del bundle en dev)
        try_files $uri @vite;
    }

    location @vite {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # ── PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
    }

    # ── Laravel (rutas normales)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Livewire file uploads
    location /livewire {
        try_files $uri $uri/ /index.php?$query_string;
        client_max_body_size 10M;
    }
}
