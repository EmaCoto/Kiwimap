services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - vite

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: kiwimap
      MYSQL_USER: kiwimap
      MYSQL_PASSWORD: kiwimap
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - db

  vite:
    image: node:24-alpine
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - vite_node_modules:/var/www/node_modules
    ports:
      - "5173:5173"
    # VITE_SERVER_ORIGIN le dice al browser desde dónde cargar los assets
    # Sin esto, Vite genera URLs absolutas que el browser no puede resolver
    # dentro de Docker, causando que Livewire pierda la conexión y recargue.
    environment:
      - VITE_SERVER_ORIGIN=http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  dbdata:
  vite_node_modules:
